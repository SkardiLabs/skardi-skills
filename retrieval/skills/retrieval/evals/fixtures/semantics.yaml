kind: semantics

metadata:
  name: retrieval-eval-fixture-semantics
  version: 1.0.0
  description: Source and column descriptions for the eval fixture.

spec:
  sources:
    - name: shop
      description: >
        E-commerce operational database mounted as a catalog. Tables:
        shop.main.orders (one row per order), shop.main.customers (one row
        per registered customer), shop.main.notes_fts (FTS5 index over
        internal policy notes, served by the read-only search-fulltext
        pipeline — auto-context's unmodified standard, honors its limit
        parameter). recent-orders is a read-only pipeline over
        shop.main.orders.
      columns:
        - name: amount_cents
          description: Order total in cents; divide by 100 for yuan.
        - name: status
          description: "Order lifecycle state: pending, paid, shipped, or refunded."
    - name: orders
      description: >
        Table-level view of shop.db's orders table; query it by the bare
        name `orders`.
