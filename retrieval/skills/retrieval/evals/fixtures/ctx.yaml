kind: context

metadata:
  name: retrieval-eval-fixture
  version: 1.0.0
  description: >
    Eval fixture: one read-only SQLite business database mounted twice
    (whole-file catalog + one table-level view of orders), plus a
    read_write scratch source that makes the decoy write pipeline
    (refresh-orders) loadable.

spec:
  data_sources:
    - name: shop
      type: sqlite
      path: "shop.db"
      access_mode: read_only
      hierarchy_level: catalog
    - name: orders
      type: sqlite
      path: "shop.db"
      access_mode: read_only
      options:
        table: orders
    - name: ops_log
      type: sqlite
      path: "scratch.db"
      access_mode: read_write
      options:
        table: ops_log
