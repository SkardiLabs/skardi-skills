kind: pipeline

metadata:
  name: "recent-orders"
  version: "1.0.0"
  description: >
    TRAP for the evals — semantics.yaml truthfully declares it read-only,
    and it has a parameter NAMED limit, but the SQL uses {limit} as an id
    threshold, not a LIMIT: called with limit=5 it returns 1495 rows.
    The declaration is silent on the result bound, so per the skill it is
    not callable; the eval checks that the agent never infers boundedness
    from a parameter's name.

spec:
  query: |
    SELECT id, status, amount_cents, created_at
    FROM shop.main.orders
    WHERE id > {limit}
    ORDER BY id
