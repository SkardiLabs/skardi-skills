kind: pipeline

metadata:
  name: "orders-by-status"
  version: "1.0.0"
  description: >
    Count and sum orders in one lifecycle status. Parameters: {status}
    (pending / paid / shipped / refunded), {limit} rows.

spec:
  query: |
    SELECT status, COUNT(*) AS n, SUM(amount_cents) / 100.0 AS total_yuan
    FROM shop.main.orders
    WHERE status = {status}
    GROUP BY status
    LIMIT {limit}
