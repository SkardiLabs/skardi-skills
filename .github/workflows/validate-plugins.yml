name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

      - name: Every skill directory carries a SKILL.md
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          dirs=(skills/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No skill directories found under skills/ — nothing to validate." >&2
            exit 1
          fi
          status=0
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "::error::${dir} has no SKILL.md"
              status=1
              continue
            fi
            # dsh drops a name that is not kebab-case and OpenClaw derives its
            # install slug from the same field. Gemini CLI, Kimi Code and Pi
            # enforce neither this nor the name/directory match below (measured
            # 2026-09-10), so a bad name installs cleanly there. This job is
            # where the guarantee comes from; do not expect a host to complain.
            if ! printf '%s' "$name" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "::error::skill directory '${name}' is not kebab-case"
              status=1
            fi
            if ! grep -Eq "^name: ${name}\$" "${dir}SKILL.md"; then
              echo "::error::${dir}SKILL.md frontmatter name does not match its directory '${name}'"
              status=1
            fi
          done
          exit $status
